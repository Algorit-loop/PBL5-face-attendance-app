/* Thu nhỏ nav sections */
.nav-section {
    margin: 15px 0 10px 0; /* Giảm margin */
}

.nav-section-title {
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.75rem; /* Giảm kích thước font */
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 20px;
    margin-bottom: 8px; /* Giảm margin */
    display: block;
}

/* Thu nhỏ nav links */
.nav-link {
    display: flex;
    align-items: center;
    padding: 10px 20px; /* Giảm padding */

    font-size: 0.9rem; /* Giảm kích thước font */
}

.nav-link:hover, .nav-link.active {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

/* Thu nhỏ bottom section */

    position: absolute;
    bottom: 0;
    left: 0;

    background: rgba(0, 0, 0, 0.2);

}

.logout-btn {
    width: 100%;
    padding: 8px 12px; /* Giảm padding */
    background: rgba(231, 76, 60, 0.8);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem; /* Giảm kích thước font */
    cursor: pointer;
    transition: all 0.3s ease;
}

.logout-btn:hover {
    background: rgba(231, 76, 60, 1);
}
</style>

<script>
// Set active link based on current page
document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active');
        } else {
            link.classList.remove('active');
        }
    });
    
    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', async function() {
        try {
            const response = await fetch('/api/logout', {
                method: 'POST'
            });
            if (response.ok) {
                window.location.href = '/login';
            }
        } catch (error) {
            console.error('Logout failed:', error);
        }
    });
});
</script>
