<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/verify.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-user-clock me-2"></i>
                Hệ thống điểm danh
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Date Time Display -->
                <div id="datetime" class="date-time ms-auto me-3"></div>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/static/pages/attendance.html"><i class="fas fa-history me-1"></i> Điểm danh</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/static/pages/verify.html"><i class="fas fa-camera me-1"></i> Xác nhận</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/static/pages/employees.html"><i class="fas fa-users me-1"></i> Nhân viên</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home me-1"></i> Trang chủ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Camera Section -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-camera me-2"></i>Camera
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="camera-frame">
                            <img id="videoFeed" src="" alt="Camera Feed">
                        </div>
                        <div class="camera-controls mt-3">
                            <button id="toggleCamera" class="btn btn-primary">
                                <i class="fas fa-camera"></i> Bật Camera
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Attendance Section -->
            <div class="col-lg-4">
                <!-- Manual Attendance Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-user-check me-2"></i>Điểm danh thủ công
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="manualAttendanceForm">
                            <div class="mb-3">
                                <label for="employeeSelect" class="form-label">Chọn nhân viên</label>
                                <select class="form-select" id="employeeSelect" required>
                                    <option value="">-- Chọn nhân viên --</option>
                                </select>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" id="checkInBtn" class="btn btn-success flex-grow-1">
                                    <i class="fas fa-sign-in-alt me-1"></i>Check-in
                                </button>
                                <button type="button" id="checkOutBtn" class="btn btn-danger flex-grow-1">
                                    <i class="fas fa-sign-out-alt me-1"></i>Check-out
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Today's Attendance Table -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-calendar-day me-2"></i>Điểm danh hôm nay
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nhân viên</th>
                                        <th>Giờ vào</th>
                                        <th>Giờ ra</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <!-- Attendance records will be loaded here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/verify.js"></script>
</body>
</html>
