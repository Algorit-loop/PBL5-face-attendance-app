<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        /* Content Area Styles */
        .content-area {
            margin-left: 250px;
            flex-grow: 1;
            padding: 20px;
        }
        .camera-container {
            width: 70%;
            float: left;
            padding: 15px;
        }
        .info-container {
            width: 30%;
            float: right;
            padding: 15px;
        }
        #videoElement {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .employee-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .action-buttons {
            margin-top: 20px;
        }
        .action-buttons button {
            width: 100%;
            margin-bottom: 10px;
        }
        .status-badge {
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: 500;
            margin-bottom: 15px;
            text-align: center;
        }
        .status-waiting {
            background-color: #f8f9fa;
            color: #6c757d;
        }
        .status-verified {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .status-error {
            background-color: #f8d7da;
            color: #842029;
        }
        .loading-spinner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner div {
            width: 3rem;
            height: 3rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 0;
            }
            .camera-container, .info-container {
                width: 100%;
                float: none;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Include Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="camera-container">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-camera me-2"></i>Face Recognition</h5>
                    </div>
                    <div class="card-body">
                        <img id="videoElement" src="/video_feed" alt="Camera Stream">
                    </div>
                </div>
            </div>

            <div class="info-container">
                <div class="employee-info">
                    <div id="statusBadge" class="status-badge status-waiting">
                        <i class="fas fa-clock me-2"></i>Chờ nhận diện khuôn mặt...
                </div>
                
                    <h4 class="mb-4">Thông tin nhân viên</h4>
                    <div id="employeeInfo">
                        <div class="mb-3">
                            <label class="form-label">Mã nhân viên</label>
                            <input type="text" class="form-control" id="empId" readonly value="-">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" id="empName" readonly value="-">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phòng ban</label>
                            <input type="text" class="form-control" id="empDepartment" readonly value="-">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Chức vụ</label>
                            <input type="text" class="form-control" id="empPosition" readonly value="-">
                        </div>
                        <div class="mb-3" id="shiftSelector" style="display: none;">
                            <label class="form-label">Ca làm việc</label>
                            <select class="form-select" id="shiftId">
                                <option value="" disabled selected>Chọn ca làm việc</option>
                                <!-- Shifts will be loaded dynamically -->
                            </select>
                        </div>
                    </div>
                    <div id="manualEntryForm" style="display: none;" class="mb-3">
                        <div class="input-group mb-2">
                            <input type="text" class="form-control" id="manualEmployeeId" placeholder="Nhập ID nhân viên">
                            <button class="btn btn-primary" id="searchEmployeeBtn">
                                <i class="fas fa-search me-2"></i>Tìm
                            </button>
                        </div>
                        <div class="text-danger small" id="manualEntryError" style="display: none;"></div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-success mb-2" id="acceptBtn" disabled>
                            <i class="fas fa-check me-2"></i>Xác nhận
                        </button>
                        <button class="btn btn-danger mb-2" id="rejectBtn" disabled>
                            <i class="fas fa-times me-2"></i>Từ chối
                        </button>
                        <button class="btn btn-secondary mb-2" id="cancelBtn" style="display: none;">
                            <i class="fas fa-ban me-2"></i>Hủy bỏ
                        </button>
                        <button class="btn btn-info" id="manualEntryBtn" style="display: none;">
                            <i class="fas fa-keyboard me-2"></i>Nhập thủ công
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load sidebar
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/static/pages/sidebar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('sidebar-container').innerHTML = html;
                    
                    // Highlight current page in sidebar after it's loaded
                    const currentPath = window.location.pathname;
                    const navLinks = document.querySelectorAll('.nav-link');
                    
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPath) {
                            link.classList.add('active');
                        } else {
                            link.classList.remove('active');
                        }
                    });
            
                    // Add event listener to logout button
                    document.getElementById('logoutBtn').addEventListener('click', async function() {
                        try {
                            loadingSpinner.style.display = 'flex';
                            const response = await fetch('/api/logout', {
                                method: 'POST'
                            });
                            if (response.ok) {
                                window.location.href = '/login';
                            }
                        } catch (error) {
                            console.error('Error during logout:', error);
                        } finally {
                            loadingSpinner.style.display = 'none';
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading sidebar:', error);
            });
        });

        // Global variables
        const acceptBtn = document.getElementById('acceptBtn');
        const rejectBtn = document.getElementById('rejectBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const manualEntryBtn = document.getElementById('manualEntryBtn');
        const manualEntryForm = document.getElementById('manualEntryForm');
        const searchEmployeeBtn = document.getElementById('searchEmployeeBtn');
        const manualEmployeeId = document.getElementById('manualEmployeeId');
        const manualEntryError = document.getElementById('manualEntryError');
        const statusBadge = document.getElementById('statusBadge');
        const loadingSpinner = document.querySelector('.loading-spinner');
        const shiftSelector = document.getElementById('shiftSelector');
        const shiftIdSelect = document.getElementById('shiftId');
        let verificationInterval = null;
        
        // Verification tracking variables
        let consecutiveRecognitions = 0;
        let currentEmployeeId = null;
        let isVerified = false;
        let isManualMode = false;
        let shifts = [];
        
        // Load user info
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                document.getElementById('currentUsername').textContent = data.full_name || data.username;
                document.getElementById('userRole').textContent = data.position === 'admin' ? 'Administrator' : 'Employee';
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }
        
        // Update status
        function updateStatus(type, message) {
            statusBadge.className = `status-badge status-${type}`;
            statusBadge.innerHTML = `<i class="fas fa-${type === 'waiting' ? 'clock' : type === 'verified' ? 'check' : 'exclamation-triangle'} me-2"></i>${message}`;
        }

        // Update employee info
        function updateEmployeeInfo(employee) {
            document.getElementById('empId').value = employee.id || '-';
            document.getElementById('empName').value = employee.full_name || '-';
            document.getElementById('empDepartment').value = employee.department || '-';
            document.getElementById('empPosition').value = employee.position || '-';
            
            // Show shift selector when employee is verified
            shiftSelector.style.display = 'block';
        }

        // Reset employee info
        function resetEmployeeInfo() {
            document.getElementById('empId').value = '-';
            document.getElementById('empName').value = '-';
            document.getElementById('empDepartment').value = '-';
            document.getElementById('empPosition').value = '-';
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;
            cancelBtn.style.display = 'none';
            manualEntryBtn.style.display = isManualMode ? 'none' : 'block';
            shiftSelector.style.display = 'none';
            shiftIdSelect.selectedIndex = 0;
            isVerified = false;
            consecutiveRecognitions = 0;
            currentEmployeeId = null;
            
            // Hide error message if any
            manualEntryError.style.display = 'none';
        }

        // Start verification process
        async function startVerification() {
            if (isVerified) return; // Skip verification if already verified
            
            try {
                const response = await fetch('/api/verify', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    console.error(`API error: ${response.status} ${response.statusText}`);
                    updateStatus('error', `Lỗi API: ${response.status}`);
                    return;
                }
                
                const data = await response.json();
                console.log("API response:", data);
                
                if (data.success && data.verified) {
                    // Employee is verified after 3 consecutive recognitions
                    isVerified = true;
                    updateEmployeeInfo(data.employee);
                    updateStatus('verified', 'Nhân viên đã được xác nhận');
                    acceptBtn.disabled = false;
                    rejectBtn.disabled = false;
                    cancelBtn.style.display = 'block';
                } else if (data.recognition_count > 0) {
                    // Show recognition progress
                    currentEmployeeId = data.employee_id;
                    consecutiveRecognitions = data.recognition_count;
                    updateStatus('waiting', `Đang xác minh: ${data.recognition_count}/3`);
                } else {
                    // Reset if no face detected
                    currentEmployeeId = null;
                    consecutiveRecognitions = 0;
                    updateStatus('waiting', 'Chờ nhận diện khuôn mặt...');
                }
            } catch (error) {
                console.error('Verification error:', error);
                updateStatus('error', 'Lỗi xác minh');
            }
        }

        // Initialize verification
        async function initialize() {
            console.log("Initializing verification process");
            
            try {
                // Load shifts data
                await loadShifts();
                
                // Check if img_historyreport directory exists, create if not
                await checkAndCreateHistoryDirectory();
                
                // Check camera status first
                const statusResponse = await fetch('/api/camera/status');
                const statusData = await statusResponse.json();
                
                if (!statusData.is_running) {
                    console.log("Camera not running, initializing...");
                    // Initialize camera if not running
                    const toggleResponse = await fetch('/api/camera/toggle', {
                        method: 'POST'
                    });
                    
                    if (!toggleResponse.ok) {
                        alert("Không thể khởi tạo camera. Vui lòng thử lại.");
                        return;
                    }
                }
                
                // Start verification process with a slight delay to ensure camera is ready
                setTimeout(() => {
                    console.log("Starting verification interval");
                    verificationInterval = setInterval(startVerification, 1000);
                }, 1000);
                
                // Show manual entry button after camera is initialized
                manualEntryBtn.style.display = 'block';
            } catch (error) {
                console.error("Error initializing camera:", error);
                alert("Lỗi khởi tạo camera: " + error.message);
            }
            
            // Add button handlers
            acceptBtn.addEventListener('click', acceptAttendance);
            rejectBtn.addEventListener('click', rejectVerification);
            cancelBtn.addEventListener('click', cancelVerification);
            manualEntryBtn.addEventListener('click', showManualEntryForm);
            searchEmployeeBtn.addEventListener('click', searchEmployee);
            
            // Add enter key handler for manual ID input
            manualEmployeeId.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchEmployee();
                }
            });
        }
        
        // Load shifts from API
        async function loadShifts() {
            try {
                const response = await fetch('/api/shifts');
                if (!response.ok) {
                    throw new Error(`Error loading shifts: ${response.status}`);
                }
                
                shifts = await response.json();
                
                // Populate shift selector
                shiftIdSelect.innerHTML = '<option value="" disabled selected>Chọn ca làm việc</option>';
                shifts.forEach(shift => {
                    const option = document.createElement('option');
                    option.value = shift.id;
                    option.textContent = `${shift.name} (${shift.start_time} - ${shift.end_time})`;
                    shiftIdSelect.appendChild(option);
                });
                
                console.log("Shifts loaded:", shifts);
            } catch (error) {
                console.error("Error loading shifts:", error);
            }
        }
        
        // Check if img_historyreport directory exists and create if not
        async function checkAndCreateHistoryDirectory() {
            try {
                const response = await fetch('/api/check-directory', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        directory: 'img_historyreport'
                    })
                });
                
                const data = await response.json();
                console.log("Directory check result:", data);
            } catch (error) {
                console.error("Error checking directory:", error);
            }
        }
        
        // Accept attendance
        async function acceptAttendance() {
            try {
                const employeeId = document.getElementById('empId').value;
                if (employeeId === '-') {
                    alert('Chưa phát hiện nhân viên');
                    return;
                }
                
                // Validate shift selection
                const shiftId = shiftIdSelect.value;
                if (!shiftId) {
                    alert('Vui lòng chọn ca làm việc');
                    return;
                }
                
                loadingSpinner.style.display = 'flex';
                
                // Capture the current video frame
                const videoElement = document.getElementById('videoElement');
                
                // Create a canvas element to capture the frame
                const canvas = document.createElement('canvas');
                canvas.width = videoElement.width || 640;
                canvas.height = videoElement.height || 480;
                
                // Draw the current video frame on the canvas
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                // Get the image data as base64 string
                const imageData = canvas.toDataURL('image/jpeg').split(',')[1]; // Remove the data:image/jpeg;base64, prefix
                
                console.log("Image captured, size:", imageData.length);
                
                // Create attendance record with the captured image
                const response = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        employee_id: employeeId,
                        shift_id: parseInt(shiftId),
                        image_data: imageData
                    })
                });
                
                if (response.ok) {
                    const attendanceData = await response.json();
                    console.log('Attendance recorded:', attendanceData);
                    
                    // Check if image was saved
                    if (attendanceData.attendance && attendanceData.attendance.image_path) {
                        console.log('Image saved at:', attendanceData.attendance.image_path);
                    } else {
                        console.warn('Image might not have been saved properly');
                    }
                    
                    updateStatus('success', 'Đã ghi nhận điểm danh');
                    setTimeout(() => {
                        resetEmployeeInfo();
                        updateStatus('waiting', 'Chờ nhận diện khuôn mặt...');
                    }, 3000);
                } else {
                    const errorData = await response.json();
                    console.error('Server error:', errorData);
                    updateStatus('error', `Lỗi ghi nhận điểm danh: ${errorData.message || 'Unknown error'}`);
                }
            } catch (error) {
                console.error('Error accepting attendance:', error);
                updateStatus('error', `Lỗi ghi nhận điểm danh: ${error.message}`);
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        // Reject verification
        function rejectVerification() {
            // Stop camera verification
            clearInterval(verificationInterval);
            cancelRecognition();
            
            // Show manual entry form
            isManualMode = true;
            manualEntryForm.style.display = 'block';
            manualEntryBtn.style.display = 'none';
            
            // Update status
            updateStatus('waiting', 'Vui lòng nhập ID nhân viên');
            
            // Reset employee info
            resetEmployeeInfo();
            
            // Focus on the input field
            manualEmployeeId.focus();
        }
        
        // Cancel verification
        async function cancelVerification() {
            try {
                loadingSpinner.style.display = 'flex';
                
                // Call the reset recognition API if we were in camera mode
                if (!isManualMode) {
                    const response = await fetch('/api/reset-recognition', {
                        method: 'POST'
                    });
                    
                    if (!response.ok) {
                        console.error(`Error resetting recognition: ${response.status}`);
                        alert('Có lỗi khi hủy nhận diện. Vui lòng thử lại.');
                        return;
                    }
                    
                    console.log("Recognition reset successfully");
                }
                
                // If we're in manual mode, go back to camera mode
                if (isManualMode) {
                    isManualMode = false;
                    manualEntryForm.style.display = 'none';
                    
                    // Restart the verification interval
                    verificationInterval = setInterval(startVerification, 1000);
                }
                
                resetEmployeeInfo();
                updateStatus('waiting', 'Chờ nhận diện khuôn mặt...');
            } catch (error) {
                console.error('Error canceling verification:', error);
                alert('Có lỗi khi hủy nhận diện: ' + error.message);
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        // Helper function to cancel recognition
        async function cancelRecognition() {
            try {
                const response = await fetch('/api/reset-recognition', {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    console.error(`Error resetting recognition: ${response.status}`);
                    return false;
                }
                
                return true;
            } catch (error) {
                console.error('Error resetting recognition:', error);
                return false;
            }
        }
        
        // Show manual entry form
        function showManualEntryForm() {
            // Stop camera verification
            clearInterval(verificationInterval);
            cancelRecognition();
            
            // Show manual entry form
            isManualMode = true;
            manualEntryForm.style.display = 'block';
            manualEntryBtn.style.display = 'none';
            
            // Update status
            updateStatus('waiting', 'Vui lòng nhập ID nhân viên');
            
            // Reset employee info
            resetEmployeeInfo();
            
            // Focus on the input field
            manualEmployeeId.focus();
        }
        
        // Search for employee by ID
        async function searchEmployee() {
            const employeeId = manualEmployeeId.value.trim();
            
            // Validate input
            if (!employeeId) {
                manualEntryError.textContent = 'Vui lòng nhập ID nhân viên';
                manualEntryError.style.display = 'block';
                return;
            }
            
            try {
                loadingSpinner.style.display = 'flex';
                manualEntryError.style.display = 'none';
                
                // Fetch employee data
                const response = await fetch(`/api/employees/${employeeId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        manualEntryError.textContent = 'Không tìm thấy nhân viên với ID này';
                        manualEntryError.style.display = 'block';
                    } else {
                        manualEntryError.textContent = `Lỗi: ${response.status} ${response.statusText}`;
                        manualEntryError.style.display = 'block';
                    }
                    return;
                }
                
                const employee = await response.json();
                
                // Update employee info
                updateEmployeeInfo(employee);
                updateStatus('verified', 'Đã tìm thấy nhân viên');
                
                // Enable buttons
                acceptBtn.disabled = false;
                rejectBtn.disabled = false;
                cancelBtn.style.display = 'block';
                isVerified = true;
                
            } catch (error) {
                console.error('Error searching for employee:', error);
                manualEntryError.textContent = `Lỗi: ${error.message}`;
                manualEntryError.style.display = 'block';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        // Close camera when navigating away
        window.addEventListener('beforeunload', async function(e) {
            // Cancel any ongoing verification
            clearInterval(verificationInterval);
            
            try {
                console.log("Closing camera on page unload");
                await fetch('/api/camera/close', { 
                    method: 'POST',
                    // Use keepalive to ensure request completes even when page is unloading
                    keepalive: true
                });
            } catch (error) {
                console.error('Error closing camera:', error);
            }
        });
        
        // Handle navigation to other pages
        document.addEventListener('click', function(e) {
            if (e.target.closest('.nav-link') && !e.target.closest('.nav-link').classList.contains('active')) {
                // Cancel any verification and close the camera before navigating
                clearInterval(verificationInterval);
                
                try {
                    console.log("Closing camera before navigation");
                    loadingSpinner.style.display = 'flex';
                    fetch('/api/camera/close', { method: 'POST' });
                } catch (error) {
                    console.error('Error closing camera:', error);
                }
            }
        });
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            initialize();
        });
    </script>
</body>
</html>
