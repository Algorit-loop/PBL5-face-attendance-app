<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống điểm danh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <div class="card-body">
                <div class="login-header">
                    <i class="fas fa-user-clock fa-3x mb-3 text-primary"></i>
                    <h3>Đăng nhập</h3>
                    <p class="text-muted">Hệ thống điểm danh nhân viên</p>
                </div>
                <div id="error-message" class="error-message" style="display: none;"></div>
                <div class="login-form">
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Đăng nhập</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Đăng nhập thành công, chuyển hướng dựa vào vai trò
                    if (data.user.position === 'admin') {
                        window.location.href = '/dashboard';
                    } else {
                        window.location.href = '/user_dashboard';
                    }
                } else {
                    // Hiển thị lỗi
                    errorMessage.textContent = data.message || 'Tên đăng nhập hoặc mật khẩu không đúng';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Lỗi đăng nhập:', error);
                errorMessage.textContent = 'Đã xảy ra lỗi. Vui lòng thử lại sau.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
