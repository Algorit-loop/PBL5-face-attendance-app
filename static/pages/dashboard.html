<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        /* Content Area Styles */
        .content-area {
            margin-left: 250px;
            flex-grow: 1;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .stat-card {
            padding: 20px;
            text-align: center;
        }
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }
        .stat-label {
            color: #6c757d;
            margin: 5px 0 0 0;
        }
        .loading-spinner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner div {
            width: 3rem;
            height: 3rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Include Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Content Area -->
        <div class="content-area">
            <h1 class="mb-4">Dashboard</h1>
            
            <!-- Statistics Cards -->
            <div class="row">
                <div class="col-md-3">
                    <div class="card stat-card bg-primary text-white">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <h2 class="stat-value" id="totalEmployees">0</h2>
                        <p class="stat-label">Total Employees</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-success text-white">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <h2 class="stat-value" id="presentToday">0</h2>
                        <p class="stat-label">Present Today</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-warning text-white">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
                        </div>
                        <h2 class="stat-value" id="lateToday">0</h2>
                        <p class="stat-label">Late Today</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card bg-danger text-white">
                        <div class="stat-icon">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <h2 class="stat-value" id="absentToday">0</h2>
                        <p class="stat-label">Absent Today</p>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions and Recent Activity -->
            <div class="row mt-4">
                <!-- Quick Actions -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Quick Actions</h5>
                            <div class="d-grid gap-2">
                                <a href="/add_employee" class="btn btn-primary">
                                    <i class="fas fa-user-plus me-2"></i>Add New Employee
                                </a>
                                <a href="/verify" class="btn btn-info text-white">
                                    <i class="fas fa-camera me-2"></i>Verify Face
                                </a>
                                <button id="trainModelBtn" class="btn btn-warning">
                                    <i class="fas fa-cogs me-2"></i>Train Model
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Recent Activity -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Recent Activity</h5>
                            <div class="list-group" id="recentActivities">
                                <!-- Activities will be loaded here -->
                                <div class="text-center py-3 text-muted">
                                    <div class="spinner-border spinner-border-sm" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <span class="ms-2">Loading activities...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Training Status -->
            <div class="row mt-4" id="trainingStatusContainer" style="display: none;">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Model Training Status</h5>
                            <div class="progress mb-3">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" id="trainingProgress" role="progressbar" style="width: 0%"></div>
                            </div>
                            <p id="trainingMessage" class="mb-0"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load sidebar
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/static/pages/sidebar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('sidebar-container').innerHTML = html;
                    
                    // Highlight current page in sidebar after it's loaded
                    const currentPath = window.location.pathname;
                    const navLinks = document.querySelectorAll('.nav-link');
                    
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPath) {
                            link.classList.add('active');
                        } else {
                            link.classList.remove('active');
                        }
                    });
                    
                    // Add event listener to logout button
                    document.getElementById('logoutBtn').addEventListener('click', async function() {
                        try {
                            loadingSpinner.style.display = 'flex';
                            const response = await fetch('/api/logout', {
                                method: 'POST'
                            });
                            if (response.ok) {
                                window.location.href = '/login';
                            }
                        } catch (error) {
                            console.error('Error during logout:', error);
                        } finally {
                            loadingSpinner.style.display = 'none';
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading sidebar:', error);
                });
        });

        // Global variables
        const loadingSpinner = document.querySelector('.loading-spinner');
        const trainingStatusContainer = document.getElementById('trainingStatusContainer');
        const trainingProgress = document.getElementById('trainingProgress');
        const trainingMessage = document.getElementById('trainingMessage');
        let trainingStatusInterval = null;

        // Load user info
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                document.getElementById('currentUsername').textContent = data.full_name || data.username;
                document.getElementById('userRole').textContent = data.position === 'admin' ? 'Administrator' : 'Employee';
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                loadingSpinner.style.display = 'flex';
                const response = await fetch('/api/dashboard');
                const data = await response.json();
                
                // Update statistics
                document.getElementById('totalEmployees').textContent = data.total_employees;
                document.getElementById('presentToday').textContent = data.present_today;
                document.getElementById('lateToday').textContent = data.late_today;
                document.getElementById('absentToday').textContent = data.absent_today;
                
                // Update recent activities
                const activitiesList = document.getElementById('recentActivities');
                if (data.recent_activities && data.recent_activities.length > 0) {
                    activitiesList.innerHTML = data.recent_activities.map(activity => `
                        <div class="list-group-item">
                            <div class="d-flex w-100 justify-content-between">
                                <h6 class="mb-1">${activity.type}</h6>
                                <small>${activity.time}</small>
                            </div>
                            <p class="mb-1">${activity.description}</p>
                        </div>
                    `).join('');
                } else {
                    activitiesList.innerHTML = '<div class="text-center py-3 text-muted">No recent activities</div>';
                }
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                const activitiesList = document.getElementById('recentActivities');
                activitiesList.innerHTML = '<div class="text-center py-3 text-danger">Error loading activities</div>';
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        // Train model
        async function trainModel() {
            try {
                loadingSpinner.style.display = 'flex';
                const response = await fetch('/api/train', { 
                    method: 'POST' 
                });
                
                if (response.ok) {
                    // Show training status container
                    trainingStatusContainer.style.display = 'block';
                    
                    // Start monitoring training status
                    monitorTrainingStatus();
                } else {
                    const data = await response.json();
                    alert('Error starting model training: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error training model:', error);
                alert('Error training model. Please try again.');
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }
        
        // Monitor training status
        function monitorTrainingStatus() {
            if (trainingStatusInterval) {
                clearInterval(trainingStatusInterval);
            }
            
            trainingStatusInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/train/status');
                    const data = await response.json();
                    
                    // Update progress bar
                    trainingProgress.style.width = `${data.progress}%`;
                    
                    // Update message
                    trainingMessage.textContent = data.message || 'Training in progress...';
                    
                    // Check if training is complete
                    if (!data.is_training && data.progress >= 100) {
                        clearInterval(trainingStatusInterval);
                        
                        // Hide training status after a delay
                        setTimeout(() => {
                            trainingStatusContainer.style.display = 'none';
                            
                            // Reload dashboard data to show updated stats
                            loadDashboardData();
                        }, 3000);
                    }
                } catch (error) {
                    console.error('Error checking training status:', error);
                    clearInterval(trainingStatusInterval);
                }
            }, 1000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadDashboardData();
            document.getElementById('trainModelBtn').addEventListener('click', trainModel);
        });
    </script>
</body>
</html>
