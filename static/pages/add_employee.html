<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .main-container {
            display: flex;
            min-height: 100vh;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar .nav-link {
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #34495e;
            border-left: 4px solid #3498db;
            padding-left: 16px;
        }
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        .logo-container {
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #34495e;
        }
        .logo-container .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 2px solid #3498db;
            background-color: #34495e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .logo-container h4 {
            color: white;
            margin: 0;
            font-size: 1.2rem;
        }
        .logo-container p {
            color: #95a5a6;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }
        .nav-section {
            margin-bottom: 15px;
        }
        .nav-section-title {
            color: #95a5a6;
            font-size: 0.8rem;
            text-transform: uppercase;
            padding: 10px 20px;
            margin: 0;
            letter-spacing: 1px;
        }
        .bottom-section {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            background-color: #243442;
            border-top: 1px solid #34495e;
        }
        .user-info {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            background-color: #2c3e50;
            margin-bottom: 10px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            background-color: #34495e;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3498db;
        }
        .user-details {
            flex-grow: 1;
            overflow: hidden;
        }
        .user-name {
            color: white;
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-role {
            color: #95a5a6;
            margin: 0;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .logout-btn {
            padding: 8px 12px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }
        .logout-btn i {
            margin-right: 8px;
        }
        .logout-btn:hover {
            background-color: #e74c3c;
        }
        /* Content Area Styles */
        .content-area {
            margin-left: 250px;
            flex-grow: 1;
            padding: 20px;
        }
        .camera-container {
            width: 70%;
            float: left;
            padding: 15px;
        }
        .form-container {
            width: 30%;
            float: right;
            padding: 15px;
        }
        #videoElement {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .capture-container {
            margin-top: 15px;
            text-align: center;
        }
        #capturedPhotos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .captured-photo {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid #dee2e6;
        }
        .form-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .loading-spinner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .loading-spinner div {
            width: 3rem;
            height: 3rem;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .content-area {
                margin-left: 0;
            }
            .camera-container, .form-container {
                width: 100%;
                float: none;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h4>Face Attendance</h4>
                <p>Management System</p>
            </div>

            <div class="nav-section">
                <h6 class="nav-section-title">Main Menu</h6>
                <a class="nav-link" href="/dashboard">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a class="nav-link" href="/verify">
                    <i class="fas fa-camera"></i>
                    <span>Verify Attendance</span>
                </a>
            </div>

            <div class="nav-section">
                <h6 class="nav-section-title">Employee Management</h6>
                <a class="nav-link active" href="/add_employee">
                    <i class="fas fa-user-plus"></i>
                    <span>Add Employee</span>
                </a>
                <a class="nav-link" href="/employees">
                    <i class="fas fa-users"></i>
                    <span>Employee List</span>
                </a>
            </div>

            <div class="nav-section">
                <h6 class="nav-section-title">Reports</h6>
                <a class="nav-link" href="/reports/daily">
                    <i class="fas fa-calendar-day"></i>
                    <span>Daily Report</span>
                </a>
                <a class="nav-link" href="/reports/monthly">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Monthly Report</span>
                </a>
        </div>

            <div class="bottom-section">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <p class="user-name" id="currentUsername">Admin User</p>
                        <p class="user-role" id="userRole">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                            </button>
                        </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="camera-container">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-camera me-2"></i>Face Capture</h5>
                    </div>
                    <div class="card-body">
                        <img id="videoElement" src="/scan_feed" alt="Camera Stream">
                        <div class="capture-container">
                            <button class="btn btn-primary" id="captureBtn" style="display:none;">
                                <i class="fas fa-camera me-2"></i>Capture Photo
                            </button>
                            <button class="btn btn-success" id="startCaptureBtn">
                                <i class="fas fa-play me-2"></i>Start Capture
                            </button>
                            <p class="mt-2 text-muted">Captured: <span id="photoCount">0</span>/50</p>
                            <div class="progress mt-2">
                                <div class="progress-bar bg-success" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>
                        <div id="capturedPhotos"></div>
                    </div>
                </div>
            </div>

            <div class="form-container">
                <div class="form-card">
                    <h4 class="mb-4">Employee Information</h4>
                    <form id="employeeForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="birthDate" class="form-label">Birth Date</label>
                                <input type="date" class="form-control" id="birthDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                            </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Department</label>
                            <select class="form-select" id="department" required>
                                <option value="">Select Department</option>
                                <option value="IT">IT</option>
                                <option value="HR">HR</option>
                                <option value="Finance">Finance</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="position" class="form-label">Position</label>
                            <select class="form-select" id="position" required>
                                <option value="">Select Position</option>
                                <option value="Manager">Manager</option>
                                <option value="Team Lead">Team Lead</option>
                                <option value="Developer">Developer</option>
                                <option value="Designer">Designer</option>
                                <option value="HR Officer">HR Officer</option>
                                <option value="Accountant">Accountant</option>
                                <option value="Marketing Specialist">Marketing Specialist</option>
                                </select>
                            </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="submitBtn" disabled>
                            <i class="fas fa-save me-2"></i>Save Employee
                        </button>
                    </form>
                    </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading-spinner">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let capturedImages = [];
        const startCaptureBtn = document.getElementById('startCaptureBtn');
        const captureBtn = document.getElementById('captureBtn');
        const photoCount = document.getElementById('photoCount');
        const capturedPhotos = document.getElementById('capturedPhotos');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.querySelector('.loading-spinner');
        const progressBar = document.querySelector('.progress-bar');
        let scanStatusInterval = null;
        let employeeId = null;
        
        // Load user info
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/user');
                const data = await response.json();
                document.getElementById('currentUsername').textContent = data.full_name || data.username;
                document.getElementById('userRole').textContent = data.position === 'admin' ? 'Administrator' : 'Employee';
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Handle logout
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                loadingSpinner.style.display = 'flex';
                const response = await fetch('/api/logout', {
                    method: 'POST'
                });
                if (response.ok) {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error during logout:', error);
            } finally {
                loadingSpinner.style.display = 'none';
            }
        });

        // Initialize - call when page loads
        async function initialize() {
            // Generate temporary ID for the scanning process
            try {
                const response = await fetch('/api/employees');
                const employees = await response.json();
                employeeId = employees.length > 0 
                    ? Math.max(...employees.map(emp => emp.id)) + 1 
                    : 1;
                
                // Start face scanning without capturing
                const scanResponse = await fetch(`/api/face-scan/start/${employeeId}`, {
                    method: 'POST'
                });
                
                if (scanResponse.ok) {
                    // Start monitoring scan status
                    startMonitoringScanStatus();
                }
            } catch (error) {
                console.error('Error initializing face scan:', error);
            }
        }
        
        // Start scan button
        startCaptureBtn.addEventListener('click', async () => {
            try {
                loadingSpinner.style.display = 'flex';
                // Start actual frame capturing
                const response = await fetch('/api/face-scan/start-capture', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    startCaptureBtn.style.display = 'none';
                    progressBar.style.width = '0%';
                } else {
                    alert('Failed to start capturing: ' + data.message);
                }
            } catch (error) {
                console.error('Error starting capture:', error);
                alert('Error starting capture. Please try again.');
            } finally {
                loadingSpinner.style.display = 'none';
            }
        });

        // Monitor scan status
        function startMonitoringScanStatus() {
            scanStatusInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/face-scan/status');
                    const status = await response.json();
                    
                    // Update frame count and progress bar
                    photoCount.textContent = `${status.frames_captured}/${status.max_frames}`;
                    progressBar.style.width = `${status.progress}%`;
                    progressBar.setAttribute('aria-valuenow', status.progress);
                    
                    // Check if scan is complete
                    if (status.scan_complete) {
                        clearInterval(scanStatusInterval);
                        submitBtn.disabled = false;
                        alert('Face scanning complete! Please fill in employee details and submit.');
                    }
                } catch (error) {
                    console.error('Error checking scan status:', error);
                }
            }, 500);
        }
        
        // Close camera when navigating away
        window.addEventListener('beforeunload', async function() {
            try {
                await fetch('/api/camera/close', { method: 'POST' });
                clearInterval(scanStatusInterval);
            } catch (error) {
                console.error('Error closing camera:', error);
            }
        });
        
        // Handle navigation to other pages
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', async function(e) {
                // Only process if this is not the current page
                if (!this.classList.contains('active')) {
                    // Close the camera before navigating
                    try {
                        await fetch('/api/camera/close', { method: 'POST' });
                        clearInterval(scanStatusInterval);
                    } catch (error) {
                        console.error('Error closing camera:', error);
                    }
                }
            });
        });
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            initialize();
        });

        // Handle employee form submission
        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                loadingSpinner.style.display = 'flex';
                
                // Get form data
                const formData = {
                    id: employeeId,
                    full_name: document.getElementById('fullName').value,
                    birth_date: document.getElementById('birthDate').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    gender: document.getElementById('gender').value,
                    department: document.getElementById('department').value,
                    position: document.getElementById('position').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                };
                
                // Validate passwords match
                if (formData.password !== document.getElementById('confirmPassword').value) {
                    alert('Passwords do not match!');
                    loadingSpinner.style.display = 'none';
                    return;
                }
                
                // Submit form
                const response = await fetch('/api/employees', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const responseData = await response.json();
                
                if (responseData.success) {
                    alert('Employee added successfully!');
                    window.location.href = '/employees';
                } else {
                    alert(`Error: ${responseData.message || 'Failed to add employee'}`);
                }
            } catch (error) {
                console.error('Error adding employee:', error);
                alert('Error adding employee. Please try again.');
            } finally {
                loadingSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
